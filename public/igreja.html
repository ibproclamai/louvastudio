<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>⚙️ Igreja - Louva.Studio</title>
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/igreja.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">â™ª</div>
        <span>Louva.Studio</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="user-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="user-name">UsuÃ¡rio</div>
          <div class="sidebar-user-role" id="user-role">membro</div>
        </div>
        <button class="sidebar-logout" id="btn-logout" title="Sair">âŽ‹</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-brand">Louva.Studio</div>
        <button class="mobile-toggle" id="mobile-toggle">â˜°</button>
      </header>
      <div class="container">
        <div class="page-header">
          <div>
            <h1>⚙️ Igreja</h1>
            <p class="subtitle">Configurações da igreja</p>
          </div>
        </div>
<form id="form-igreja" class="form config-form">
      <h3>Dados principais</h3>
      <label>Nome da Igreja *
        <input type="text" name="nome_igreja" required placeholder="Ex: Igreja Batista Central">
      </label>
      <label>Cidade
        <input type="text" name="cidade" placeholder="São Paulo, SP">
      </label>
      <label>Endereco
        <input type="text" name="endereco" placeholder="Rua, número, bairro">
      </label>

      <h3>Lideranca</h3>
      <div class="form-row">
        <label>Pastor
          <input type="text" name="pastor" placeholder="Nome do pastor">
        </label>
        <label>Lider de Louvor
          <input type="text" name="louvor_responsavel" placeholder="Nome do lider">
        </label>
      </div>

      <h3>Contato</h3>
      <div class="form-row">
        <label>Telefone
          <input type="text" name="contato" placeholder="(11) 1234-5678">
        </label>
        <label>WhatsApp
          <input type="text" name="whatsapp" placeholder="(11) 91234-5678">
        </label>
      </div>
      <label>Site
        <input type="url" name="site" placeholder="https://sua-igreja.com">
      </label>
      <label>URL do Logo
        <input type="url" name="logo_url" placeholder="https://...">
      </label>

      <h3>Mensagens</h3>
      <label>Versiculo do dia
        <textarea name="versiculo" rows="2" placeholder="Ex: 'Louvai ao Senhor, porque ele é bom' - Salmos 107:1"></textarea>
      </label>
      <label>Mensagem do rodapé das escalas
        <textarea name="mensagem_rodape" rows="2" placeholder="Ex: 'Que o louvor seja para a glória de Deus!'"></textarea>
      </label>

      <div class="form-actions">
        <button type="button" class="btn" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-save">Salvar e ir para o sistema</button>
      </div>
    </form>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/igreja.js"></script>
</body>
</html>
