<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <title>Eventos - Louva.Studio</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/eventos.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><a href="/dashboard.html" style="color:inherit;text-decoration:none">Louva.Studio</a></div>
    <button class="nav-toggle" aria-label="Menu" onclick="window.toggleNav && window.toggleNav()">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-menu">
      <ul class="nav-links">
        <li><a href="/dashboard.html">Inicio</a></li>
        <li><a href="/schedules.html">Escalas</a></li>
        <li><a href="/my-schedule.html">Minhas</a></li>
        <li><a href="/songs.html">Musicas</a></li>
        <li><a href="/members.html">Membros</a></li>
        <li><a href="/eventos.html" class="active">Eventos</a></li>
        <li><a href="/chat.html">Chat</a></li>
        <li class="admin-only"><a href="/relatorios.html">Relatorios</a></li>
        <li class="admin-only"><a href="/studio.html">Estudio</a></li>
      </ul>
      <div class="nav-user">
        <span id="user-name" class="user-chip"></span>
        <button id="btn-logout" class="btn btn-ghost btn-sm">Sair</button>
      </div>
    </div>
  </nav>
  <div id="nav-overlay"></div>

  <main class="page-container">
    <header class="page-header">
      <h1>Eventos</h1>
      <button id="btn-new-event" class="btn btn-primary">+ Novo Evento</button>
    </header>

    <div class="filter-bar">
      <div class="filter-chips" id="filter-tipos"></div>
      <div class="filter-search">
        <input type="text" id="search-input" placeholder="Buscar por titulo..." class="input">
      </div>
    </div>

    <div class="view-toggle">
      <button class="view-btn active" data-view="calendar">Calendario</button>
      <button class="view-btn" data-view="list">Lista</button>
    </div>

    <section id="calendar-view" class="calendar-section">
      <div class="calendar-header">
        <button id="btn-prev-month" class="btn btn-ghost btn-sm">&lt;</button>
        <h2 id="calendar-title"></h2>
        <button id="btn-next-month" class="btn btn-ghost btn-sm">&gt;</button>
      </div>
      <div class="calendar-weekdays">
        <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sab</span>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </section>

    <section id="list-view" class="list-section" style="display:none">
      <div id="eventos-list" class="events-list"></div>
    </section>
  </main>

  <div id="modal-evento" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Novo Evento</h2>
        <button class="modal-close" onclick="closeModal('modal-evento')">&times;</button>
      </div>
      <form id="form-evento" class="modal-body">
        <input type="hidden" id="ev-id">
        <div class="form-row">
          <div class="form-group">
            <label>Titulo *</label>
            <input type="text" id="ev-titulo" class="input" required>
          </div>
          <div class="form-group">
            <label>Tipo *</label>
            <select id="ev-tipo" class="input" required></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Data *</label>
            <input type="date" id="ev-data" class="input" required>
          </div>
          <div class="form-group">
            <label>Hora Inicio</label>
            <input type="time" id="ev-hora-inicio" class="input">
          </div>
          <div class="form-group">
            <label>Hora Fim</label>
            <input type="time" id="ev-hora-fim" class="input">
          </div>
        </div>
        <div class="form-group">
          <label>Local</label>
          <input type="text" id="ev-local" class="input" placeholder="Ex: Templo principal, Sala 3...">
        </div>
        <div class="form-group">
          <label>Descricao</label>
          <textarea id="ev-descricao" class="input" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Cor</label>
          <input type="color" id="ev-cor" class="input-color" value="#6366f1">
        </div>
        <div class="form-group" id="participants-section" style="display:none">
          <label>Participantes</label>
          <div class="participants-input">
            <select id="select-membro" class="input"><option value="">Selecione um membro...</option></select>
            <input type="text" id="participant-funcao" class="input" placeholder="Funcao (opcional)">
            <button type="button" id="btn-add-participant" class="btn btn-ghost">Adicionar</button>
          </div>
          <ul id="participants-list" class="participants-list"></ul>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal('modal-evento')">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-detail" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="detail-title"></h2>
        <button class="modal-close" onclick="closeModal('modal-detail')">&times;</button>
      </div>
      <div class="modal-body" id="detail-body"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/eventos.js"></script>
</body>
</html>
