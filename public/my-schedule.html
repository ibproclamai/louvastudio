<div id="modal-add-song" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Adicionar música à escala</h2>

        <div class="form-group">
          <label>Música</label>

        </div>
        <div class="form-group">
          <label>Ordem na escala</label>
          <input type="number" id="add-song-ordem" class="input" min="1" value="1">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal('modal-add-song')">Cancelar</button>
