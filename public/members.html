<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>👥 Equipe - Louva.Studio</title>
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">â™ª</div>
        <span>Louva.Studio</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="user-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="user-name">UsuÃ¡rio</div>
          <div class="sidebar-user-role" id="user-role">membro</div>
        </div>
        <button class="sidebar-logout" id="btn-logout" title="Sair">âŽ‹</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-brand">Louva.Studio</div>
        <button class="mobile-toggle" id="mobile-toggle">â˜°</button>
      </header>
      <div class="container">
        <div class="page-header">
          <div>
            <h1>👥 Equipe</h1>
            <p class="subtitle">Membros do ministério</p>
          </div>
        </div>
<div class="filters">
      <input type="text" id="search-member" placeholder="Buscar por nome ou função...">
    </div>

    <div id="members-list" class="card-grid">
      <p class="empty">Carregando...</p>
    </div>
    </main>
  </div>

<div id="modal-member" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Novo membro</h2>
        <button class="modal-close" data-close>&times;</button>
      </div>
      <form id="form-member" class="form">
        <input type="hidden" name="id">
        <label>Nome *
          <input type="text" name="nome" required>
        </label>
        <label>Função
          <select name="função">
            <option value="">Selecione...</option>
            <option>Vocal</option>
            <option>Violao</option>
            <option>Guitarra</option>
            <option>Baixo</option>
            <option>Bateria</option>
            <option>Teclado</option>
            <option>Violino</option>
            <option>Cajon</option>
            <option>Backing Vocal</option>
            <option>Som</option>
            <option>Outro</option>
          </select>
        </label>
        <label>Telefone
          <input type="text" name="telefone" placeholder="(00) 00000-0000">
        </label>
        <label>Email
          <input type="email" name="email">
        </label>
        <label>Disponibilidade
          <textarea name="disponibilidade" rows="2" placeholder="Ex: Domingos manhã, quartas..."></textarea>
        </label>
        <label class="checkbox">
          <input type="checkbox" name="ativo" checked> Ativo
        </label>
        <div class="form-actions">
          <button type="button" class="btn" data-close>Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/members.js"></script>
</body>
</html>
