<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>💬 Chat - Louva.Studio</title>
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">â™ª</div>
        <span>Louva.Studio</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="user-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="user-name">UsuÃ¡rio</div>
          <div class="sidebar-user-role" id="user-role">membro</div>
        </div>
        <button class="sidebar-logout" id="btn-logout" title="Sair">âŽ‹</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-brand">Louva.Studio</div>
        <button class="mobile-toggle" id="mobile-toggle">â˜°</button>
      </header>
      <div class="container">
        <div class="page-header">
          <div>
            <h1>💬 Chat</h1>
            <p class="subtitle">Comunicação da equipe</p>
          </div>
        </div>
<aside class="chat-sidebar" id="chat-sidebar">
      <div class="chat-header">
        <h2>Ministério</h2>
        <button class="icon-btn" id="btn-close-sidebar" aria-label="Voltar">&larr;</button>
      </div>
      <div class="chat-channel">
        <div class="channel-item active">
          <span class="channel-icon">&#127757;</span>
          <div>
            <strong>Geral do Ministério</strong>
            <small>Todos os membros</small>
          </div>
        </div>
      </div>
      <h3 style="padding:0.5rem 1rem;margin:0;font-size:0.85rem;color:var(--text-muted)">Membros</h3>
      <ul class="members-list" id="members-list"></ul>
    </aside>

    <section class="chat-main">
      <header class="chat-main-header">
        <button class="icon-btn mobile-only" id="btn-open-sidebar" aria-label="Membros">&#9776;</button>
        <div>
          <h2 id="chat-channel-name">Geral do Ministério</h2>
          <small id="chat-channel-info" class="text-muted">Conversa com todo o ministério</small>
        </div>
        <div class="connection-status">
          <span id="conn-dot" class="conn-dot"></span>
          <span id="conn-text">Conectado</span>
        </div>
      </header>

      <div class="chat-messages" id="chat-messages">
        <div class="empty-chat">Nenhuma mensagem ainda. Comece a conversa!</div>
      </div>

      <form class="chat-input" id="chat-form">
        <textarea id="msg-input" placeholder="Digite uma mensagem..." rows="1" maxlength="2000" required></textarea>
        <button type="submit" class="btn btn-primary" id="btn-send">Enviar</button>
      </form>
    </section>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
