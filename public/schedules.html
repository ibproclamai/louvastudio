<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Escalas - Louva.Studio</title>
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-icon">♪</div>
        <span>Louva.Studio</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="user-avatar">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="user-name">Usuário</div>
          <div class="sidebar-user-role" id="user-role">membro</div>
        </div>
        <button class="sidebar-logout" id="btn-logout" title="Sair">⎋</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-brand">Louva.Studio</div>
        <button class="mobile-toggle" id="mobile-toggle">☰</button>
      </header>
      <div class="container">
        <div class="page-header">
          <h1>📅 Escalas</h1>
          <p class="subtitle">Monte e consulte escalas de cultos</p>
        </div>
        <div class="page-header" style="margin-bottom:1.5rem;">
          <div class="filters" style="margin:0; flex:1;">
            <select id="filter-status">
              <option value="">Todas as escalas</option>
              <option value="rascunho">Rascunhos</option>
              <option value="publicada">Publicadas</option>
            </select>
          </div>
          <button id="btn-new-schedule" class="btn btn-primary" data-admin-only>+ Nova escala</button>
        </div>

        <div id="schedules-list" class="schedule-list">
          <p class="empty">Carregando...</p>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-schedule" class="modal hidden">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2 id="modal-title">Nova escala</h2>
        <button class="modal-close" data-close>&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-schedule">
          <input type="hidden" name="id">
          <div class="form-row">
            <div class="form-group">
              <label>Data do culto *</label>
              <input type="date" name="data_culto" class="input" required>
            </div>
            <div class="form-group">
              <label>Tipo</label>
              <select name="tipo_culto" class="input">
                <option value="">Selecione...</option>
                <option>Culto Dominical - Manhã</option>
                <option>Culto Dominical - Noite</option>
                <option>Culto de Oração</option>
                <option>Culto de Jovens</option>
                <option>Culto de Crianças</option>
                <option>Ensaio</option>
                <option>Evento Especial</option>
                <option>Outro</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Local</label>
              <input type="text" name="local" class="input" placeholder="Templo principal, salão...">
            </div>
            <div class="form-group">
              <label>Status</label>
              <select name="status" class="input">
                <option value="rascunho">Rascunho</option>
                <option value="publicada">Publicada</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Observações</label>
            <textarea name="observacoes" class="input" rows="2"></textarea>
          </div>

          <fieldset style="border:1px solid var(--border); border-radius:var(--radius); padding:0.75rem; margin-bottom:1rem;">
            <legend style="padding:0 0.4rem; font-size:0.85rem; color:var(--text-muted);">Membros escalados</legend>
            <div id="schedule-members" class="checkbox-list">
              <p class="empty">Carregando membros...</p>
            </div>
            <button type="button" id="btn-add-member" class="btn btn-sm">+ Adicionar membro</button>
          </fieldset>

          <fieldset style="border:1px solid var(--border); border-radius:var(--radius); padding:0.75rem;">
            <legend style="padding:0 0.4rem; font-size:0.85rem; color:var(--text-muted);">Músicas da escala</legend>
            <div id="schedule-songs" class="song-picker">
              <p class="empty">Carregando músicas...</p>
            </div>
            <button type="button" id="btn-add-song" class="btn btn-sm">+ Adicionar música</button>
          </fieldset>

          <div class="form-actions">
            <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/schedules.js"></script>
</body>
</html>
